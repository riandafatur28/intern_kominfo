              rank: Penata Muda
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Profil berhasil diperbarui.
                  data:
                    $ref: "#/components/schemas/ProfileData"
              example:
                success: true
                message: Profil berhasil diperbarui.
                data:
                  id: 1
                  name: Budi Santoso
                  nip: "199001012023011001"
                  email: budi@kominfo.go.id
                  rank: Penata Muda
                  position: Analis Sistem Informasi
                  phone: "081298765432"
                  signature_path: signatures/budi-signature.png
                  signature_url: http://localhost/storage/signatures/budi-signature.png
                  is_active: true
                  roles: [staf]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "The phone must not be greater than 20 characters."
  /api/profile/signature:
    post:
      tags: [Profile]
      summary: Upload signature image
      operationId: uploadSignature
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [signature]
              properties:
                signature:
                  type: string
                  format: binary
                  description: PNG/JPG/JPEG, max 2MB, max 2000x2000px
      responses:
        "200":
          description: Signature uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureUploadResponse"
              example:
                success: true
                message: Tanda tangan berhasil diunggah.
                data:
                  signature_path: signatures/1-signature.png
                  signature_url: http://localhost/storage/signatures/1-signature.png
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "The signature must be a file of type: png, jpg, jpeg."
  # ── User Management ──────────────────────────────────────────────
