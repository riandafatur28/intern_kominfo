  /api/wfh/attendance:
    post:
      tags: [WFH Attendance]
      summary: Check in for WFH attendance
      operationId: checkInAttendance
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: JPG/JPEG/PNG, max 2MB
                session:
                  type: string
                  enum: [pagi, sore]
                  nullable: true
                  default: pagi
                  example: pagi
                date:
                  type: string
                  format: date
                  nullable: true
                  description: Must be today. Defaults to today.
                  example: "2025-07-11"
      responses:
        "201":
          description: Attendance recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
              example:
                success: true
                message: Absensi WFH berhasil.
                data:
                  id: 45
                  date: "2025-07-11"
                  session: pagi
                  photo_url: http://localhost/storage/attendances/1/2025-07-11/photo.jpg
                  check_in_at: "2025-07-11T08:15:30.000000Z"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Missing permission wfh.attendance.create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
        "422":
          description: Validation error, wrong day, or duplicate check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Anda sudah melakukan absensi untuk sesi ini.
