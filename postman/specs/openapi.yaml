        data:
          type: array
          items:
            $ref: "#/components/schemas/WfhTeamReport"
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 3
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 32
        from:
          type: integer
          nullable: true
          example: 1
        to:
          type: integer
          nullable: true
          example: 15
        first_page_url:
          type: string
          format: uri
          example: "http://localhost/api/admin/wfh/team-reports?page=1"
        last_page_url:
          type: string
          format: uri
          example: "http://localhost/api/admin/wfh/team-reports?page=3"
        next_page_url:
          type: string
          format: uri
          nullable: true
          example: "http://localhost/api/admin/wfh/team-reports?page=2"
        prev_page_url:
          type: string
          format: uri
          nullable: true
          example: null
        path:
          type: string
          example: "http://localhost/api/admin/wfh/team-reports"
  parameters:
    UserIdPath:
      name: user
      in: path
      required: true
      schema:
        type: integer
      description: User ID
      example: 12
    ReportIdPath:
      name: report
      in: path
      required: true
      schema:
        type: integer
      description: WFH Report ID
      example: 23
    InitiationIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Change Initiation ID
      example: 8
    ImplementationIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Change Implementation ID
      example: 4
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication and session management
  - name: Profile
    description: Self-service profile and signature management
  - name: User Management
    description: Admin user CRUD and import
  - name: RBAC Management
    description: Dynamic role-permission management (view roles, toggle permissions)
  - name: Settings
    description: Application-wide key/value settings management
  - name: WFH Attendance
    description: Work-from-home attendance check-in
  - name: WFH Reports
    description: WFH report CRUD and approval workflow
  - name: WFH Monitoring
    description: Admin monitoring of WFH attendance and reports
  - name: WFH Team Reports
    description: Team-level WFH report creation and supervisor approval
  - name: Change Initiation
    description: Change initiation workflow (draft → pending → approved/rejected)
  - name: Change Implementation
    description: Change implementation, review, and attachments
  - name: Verification
    description: Public QR token document verification
paths:
  # ── Auth ─────────────────────────────────────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and obtain bearer token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: budi@kominfo.go.id
              password: rahasia123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                success: true
                message: Login berhasil.
                data:
                  token: "1|abcdef1234567890abcdef1234567890abcdef12"
                  user:
                    id: 1
                    name: Budi Santoso
                    nip: "199001012023011001"
                    email: budi@kominfo.go.id
                    rank: Pengatur Muda
                    position: Staf Pelaksana
                    phone: "081234567890"
                    signature_path: signatures/budi-signature.png
                    is_active: true
                    roles: [staf]
                    permissions: [wfh.attendance.create, wfh.report.create]
                    team:
                      id: 3
                      name: Tim Aplikasi
                      leader:
                        id: 5
                        name: Siti Nurhaliza
                      field:
                        id: 1
                        name: Bidang Teknologi Informasi
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Email atau password salah.
        "403":
          description: Account inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Akun tidak aktif. Hubungi administrator.
        "429":
          description: Too many login attempts (throttle:auth)
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get authenticated user
      operationId: getMe
      responses:
        "200":
          description: Authenticated user data
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AuthUser"
              example:
                success: true
                data:
                  id: 1
                  name: Budi Santoso
                  nip: "199001012023011001"
                  email: budi@kominfo.go.id
                  rank: Pengatur Muda
                  position: Staf Pelaksana
                  phone: "081234567890"
                  signature_path: signatures/budi-signature.png
                  is_active: true
                  roles: [staf]
                  permissions: [wfh.attendance.create, wfh.report.create]
                  team:
                    id: 3
                    name: Tim Aplikasi
                    leader:
                      id: 5
                      name: Siti Nurhaliza
                    field:
                      id: 1
                      name: Bidang Teknologi Informasi
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke current token
      operationId: logout
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Logout berhasil.
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the authenticated user's password
      operationId: changePassword
      security:
        - bearerAuth: []
      description: |
        Allows an authenticated user to set a new password. Reachable even when
        the `password.changed` middleware would otherwise block access — used to
        satisfy the forced password-change flow (`must_change_password`).
        On success, `must_change_password` is cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Password berhasil diubah.
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "422":
          description: current_password incorrect, or new_password invalid/unconfirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                wrongCurrent:
                  summary: current_password does not match
                  value:
                    success: false
                    message: "Password saat ini tidak sesuai."
                notConfirmed:
                  summary: new_password confirmation mismatch
                  value:
                    success: false
                    message: "Konfirmasi password baru tidak sesuai."
