          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Settings ──────────────────────────────────────────────────────
  /api/admin/settings:
    get:
      tags: [Settings]
      summary: List all settings as a key→value map
      operationId: listSettings
      security:
        - bearerAuth: []
      description: |
        Returns every setting as a flat `{ key: value }` object. Values are
        JSON-decoded when possible (numbers, booleans, arrays). Requires the
        `setting.manage` permission.
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
                    description: Arbitrary key→value pairs.
                    example:
                      default_password.staf: "Rahasia123!"
                      default_password.kepala_tim: "KtRahasia123!"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Missing setting.manage permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
  /api/admin/settings/{key}:
    put:
      tags: [Settings]
      summary: Update a single setting value
      operationId: updateSetting
      security:
        - bearerAuth: []
      description: |
        Updates the value of an existing setting identified by `key`. Requires
        the `setting.manage` permission.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Setting key (must already exist).
          example: default_password.staf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingRequest"
      responses:
        "200":
          description: Setting updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [key, value]
                    properties:
                      key:
                        type: string
                        example: default_password.staf
                      value:
                        description: Updated value (decoded if JSON-encodable).
                        example: "RahasiaBaru123!"
              example:
                data:
                  key: default_password.staf
                  value: "RahasiaBaru123!"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Missing setting.manage permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
        "422":
          description: Setting key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Setting 'unknown_key' tidak ditemukan."
