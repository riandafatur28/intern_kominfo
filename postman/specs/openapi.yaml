  # ── RBAC Management ──────────────────────────────────────────────
  /api/admin/roles:
    get:
      tags: [RBAC Management]
      summary: List all roles with their permissions
      operationId: listRoles
      security:
        - bearerAuth: []
      description: |
        Returns all roles (admin, kepala_bidang, kepala_tim, staf) with their
        currently assigned permissions. Requires `role.manage` permission.
      responses:
        "200":
          description: Role list with permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "403":
          description: Missing role.manage permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
  /api/admin/roles/{id}/permissions:
    put:
      tags: [RBAC Management]
      summary: Sync permissions for a role
      operationId: updateRolePermissions
      security:
        - bearerAuth: []
      description: |
        Replaces the full set of permissions for a role.
        Protected roles (admin) cannot lose critical permissions
        (role.manage, permission.manage, user.manage) — prevents system lockout.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Role ID
          example: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRolePermissionsRequest"
      responses:
        "200":
          description: Permissions updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Permission untuk role berhasil diperbarui.
                  data:
                    $ref: "#/components/schemas/RoleResource"
        "403":
          description: Missing role.manage permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Role tidak ditemukan.
        "422":
          description: Validation error or protected role lockout prevention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidPermission:
                  summary: Permission name does not exist
                  value:
                    success: false
                    message: "The selected permissions.1 is invalid."
                lockoutPrevention:
                  summary: Cannot strip critical permissions from admin
                  value:
                    success: false
                    message: "Role 'admin' tidak boleh kehilangan permission kritis: role.manage, permission.manage, user.manage."
  /api/admin/permissions:
    get:
      tags: [RBAC Management]
      summary: List all available permissions
      operationId: listPermissions
      security:
        - bearerAuth: []
      description: |
        Returns all registered permissions in the system.
