openapi: 3.0.3
info:
  title: Intern Kominfo API
  version: 3.0.0
  description: |
    API for the Intern Kominfo application — a government intern management
    platform with Work-From-Home (WFH) reporting, change management workflows,
    user administration, and QR-based document verification.

    Authentication uses Laravel Sanctum bearer tokens.
    Authorization uses Spatie permission-based roles (admin, kepala_bidang, kepala_tim, staf).
    The `kepala_bidang` role (field head) approves WFH reports as "atasan langsung".
    The `kepala_tim` role (team leader) approves change initiations and reviews implementations.
    Admin is scoped to their own field (bidang).
servers:
  - url: http://localhost
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    # ── Envelope wrappers ──────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Email atau password salah.
    SuccessResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Logout berhasil.
    PaginationMeta:
      type: object
      required: [current_page, last_page, total]
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 5
        total:
          type: integer
          example: 72
    # ── Auth ────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: budi@kominfo.go.id
        password:
          type: string
          format: password
          example: rahasia123
      example:
        email: budi@kominfo.go.id
        password: rahasia123
    LoginResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login berhasil.
        data:
          type: object
          required: [token, user]
          properties:
            token:
              type: string
              example: "1|abcdef1234567890abcdef1234567890abcdef12"
            user:
              $ref: "#/components/schemas/AuthUser"
      example:
        success: true
        message: Login berhasil.
        data:
          token: "1|abcdef1234567890abcdef1234567890abcdef12"
          user:
            id: 1
            name: Budi Santoso
            nip: "199001012023011001"
            email: budi@kominfo.go.id
            rank: Pengatur Muda
            position: Staf Pelaksana
            phone: "081234567890"
            signature_path: signatures/budi-signature.png
            must_change_password: true
            is_active: true
            roles: [staf]
            permissions: [wfh.attendance.create, wfh.report.create]
            team:
              id: 3
              name: Tim Aplikasi
              leader:
                id: 5
                name: Siti Nurhaliza
              field:
                id: 1
                name: Bidang Teknologi Informasi
    AuthUser:
      type: object
      required: [id, name, nip, email, must_change_password, is_active, roles, permissions]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Budi Santoso
        nip:
          type: string
          example: "199001012023011001"
        email:
          type: string
          format: email
          example: budi@kominfo.go.id
        rank:
          type: string
          nullable: true
          example: Pengatur Muda
        position:
          type: string
          nullable: true
          example: Staf Pelaksana
        phone:
          type: string
          nullable: true
          example: "081234567890"
        signature_path:
          type: string
          nullable: true
          example: signatures/budi-signature.png
        must_change_password:
          type: boolean
          description: True when the user must set a new password before full access is granted.
          example: true
        is_active:
          type: boolean
          example: true
        roles:
          type: array
          items:
            type: string
          example: [staf]
        permissions:
          type: array
          items:
            type: string
          example: [wfh.attendance.create, wfh.report.create]
        team:
          $ref: "#/components/schemas/TeamNested"
    # ── Profile ─────────────────────────────────────────────────────
    ProfileData:
      type: object
      required: [id, name, nip, email, is_active, roles]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Budi Santoso
        nip:
          type: string
          example: "199001012023011001"
        email:
          type: string
          format: email
          example: budi@kominfo.go.id
        rank:
          type: string
          nullable: true
          example: Pengatur Muda
        position:
          type: string
          nullable: true
          example: Staf Pelaksana
        phone:
          type: string
          nullable: true
          example: "081234567890"
        signature_path:
          type: string
          nullable: true
          example: signatures/budi-signature.png
        signature_url:
          type: string
          nullable: true
          format: uri
          example: http://localhost/storage/signatures/budi-signature.png
        is_active:
          type: boolean
          example: true
        roles:
          type: array
          items:
            type: string
          example: [staf]
      example:
        id: 1
        name: Budi Santoso
        nip: "199001012023011001"
        email: budi@kominfo.go.id
        rank: Pengatur Muda
        position: Staf Pelaksana
        phone: "081234567890"
        signature_path: signatures/budi-signature.png
        signature_url: http://localhost/storage/signatures/budi-signature.png
        is_active: true
        roles: [staf]
    UpdateProfileRequest:
      type: object
      properties:
        phone:
          type: string
          maxLength: 20
          nullable: true
          example: "081298765432"
        position:
          type: string
          maxLength: 255
          nullable: true
          example: Analis Sistem Informasi
        rank:
          type: string
          maxLength: 255
          nullable: true
          example: Penata Muda
      example:
        phone: "081298765432"
        position: Analis Sistem Informasi
        rank: Penata Muda
    SignatureUploadResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Tanda tangan berhasil diunggah.
        data:
          type: object
          required: [signature_path, signature_url]
          properties:
            signature_path:
              type: string
              example: signatures/1-signature.png
            signature_url:
              type: string
              format: uri
              example: http://localhost/storage/signatures/1-signature.png
      example:
        success: true
        message: Tanda tangan berhasil diunggah.
        data:
          signature_path: signatures/1-signature.png
          signature_url: http://localhost/storage/signatures/1-signature.png
    # ── User Management ─────────────────────────────────────────────
    StoreUserRequest:
      type: object
      required: [name, nip, email, roles]
      properties:
        name:
          type: string
          maxLength: 255
          example: Dewi Lestari
        nip:
          type: string
          maxLength: 50
          example: "199503152024011002"
        email:
          type: string
          format: email
          example: dewi@kominfo.go.id
        team_id:
          type: integer
          nullable: true
          example: 3
        rank:
          type: string
          maxLength: 255
          nullable: true
          example: Pengatur Muda
        position:
          type: string
          maxLength: 255
          nullable: true
          example: Staf Pelaksana
        phone:
          type: string
          maxLength: 20
          nullable: true
          example: "081345678901"
        password:
          type: string
          format: password
          nullable: true
          minLength: 8
          maxLength: 255
          description: Optional. If omitted, a default password is injected from Settings based on the assigned role.
          example: rahasiaBudi123
        roles:
          type: array
          items:
            type: string
            enum: [admin, kepala_bidang, kepala_tim, staf]
          example: [staf]
        permissions:
          type: array
          nullable: true
          description: Direct permissions assigned to the user (overrides role defaults).
          items:
            type: string
          example: [wfh.report.approve]
      example:
        name: Budi Santoso
        nip: "199503152024011002"
        email: budi@kominfo.go.id
        team_id: 3
        rank: Penata Muda
        position: Programmer
        phone: "081234567890"
        password: rahasiaBudi123
        roles: [staf]
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: Dewi Lestari Wijaya
        nip:
          type: string
          maxLength: 50
          example: "199503152024011002"
        email:
          type: string
          format: email
          example: dewi.wijaya@kominfo.go.id
        team_id:
          type: integer
          nullable: true
          example: 5
        rank:
          type: string
          maxLength: 255
          nullable: true
          example: Penata Muda
        position:
          type: string
          maxLength: 255
          nullable: true
          example: Analis Sistem Informasi
        phone:
          type: string
          maxLength: 20
          nullable: true
          example: "081334455667"
        roles:
          type: array
          items:
            type: string
            enum: [admin, kepala_bidang, kepala_tim, staf]
          example: [kepala_tim]
        permissions:
          type: array
          description: Direct permissions (syncs — replaces all direct permissions).
          items:
            type: string
          example: [change.implementation.review]
        is_active:
          type: boolean
          example: true
      example:
        name: Andi Wijaya
        position: Analis Sistem Informasi
        rank: Penata Muda
        roles: [kepala_tim]
        is_active: true
    UserResource:
      type: object
      required: [id, name, nip, email, is_active]
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: Dewi Lestari
        nip:
          type: string
          example: "199503152024011002"
        email:
          type: string
          format: email
          example: dewi@kominfo.go.id
        rank:
          type: string
          nullable: true
          example: Pengatur Muda
        position:
          type: string
          nullable: true
          example: Staf Pelaksana
        phone:
          type: string
          nullable: true
          example: "081345678901"
        is_active:
          type: boolean
          example: true
        signature_path:
          type: string
          nullable: true
          example: signatures/12-signature.png
        roles:
          type: array
          items:
            type: string
          example: [staf]
        direct_permissions:
          type: array
          description: Direct permissions assigned specifically to this user (not via role).
          items:
            type: string
          example: []
        created_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-07-14T08:30:00.000000Z"
        team:
          $ref: "#/components/schemas/TeamNested"
      example:
        id: 12
        name: Dewi Lestari
        nip: "199503152024011002"
        email: dewi@kominfo.go.id
        rank: Pengatur Muda
        position: Staf Pelaksana
        phone: "081345678901"
        is_active: true
        signature_path: null
        roles: [staf]
        created_at: "2025-07-14T08:30:00.000000Z"
        team:
          id: 3
          name: Tim Aplikasi
          leader:
            id: 5
            name: Siti Nurhaliza
          field:
            id: 1
            name: Bidang Teknologi Informasi
    TeamNested:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Tim Aplikasi
        leader:
          type: object
          properties:
            id:
              type: integer
              example: 5
            name:
              type: string
              example: Siti Nurhaliza
        field:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Bidang Teknologi Informasi
      example:
        id: 3
        name: Tim Aplikasi
        leader:
          id: 5
          name: Siti Nurhaliza
        field:
          id: 1
          name: Bidang Teknologi Informasi
    UserListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResource"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      example:
        success: true
        data:
          - id: 1
            name: Budi Santoso
            nip: "199001012023011001"
            email: budi@kominfo.go.id
            rank: Pengatur Muda
            position: Staf Pelaksana
            phone: "081234567890"
            is_active: true
            signature_path: signatures/1-signature.png
            roles: [staf]
            created_at: "2025-07-01T08:00:00.000000Z"
            team:
              id: 3
              name: Tim Aplikasi
              leader:
                id: 5
                name: Siti Nurhaliza
              field:
                id: 1
                name: Bidang Teknologi Informasi
          - id: 12
            name: Dewi Lestari
            nip: "199503152024011002"
            email: dewi@kominfo.go.id
            rank: Pengatur Muda
            position: Staf Pelaksana
            phone: "081345678901"
            is_active: true
            signature_path: null
            roles: [staf]
            created_at: "2025-07-14T08:30:00.000000Z"
            team:
              id: 3
              name: Tim Aplikasi
              leader:
                id: 5
                name: Siti Nurhaliza
              field:
                id: 1
                name: Bidang Teknologi Informasi
        meta:
          current_page: 1
          last_page: 5
          total: 72
    # ── WFH Attendance ──────────────────────────────────────────────
    AttendanceResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Absensi WFH berhasil.
        data:
          type: object
          required: [id, date, session, photo_url, check_in_at]
          properties:
            id:
              type: integer
              example: 45
            date:
              type: string
              format: date
              example: "2025-07-11"
            session:
              type: string
              enum: [pagi, sore]
              example: pagi
            photo_url:
              type: string
              format: uri
              example: http://localhost/storage/attendances/1/2025-07-11/photo.jpg
            check_in_at:
              type: string
              format: date-time
              example: "2025-07-11T08:15:30.000000Z"
      example:
        success: true
        message: Absensi WFH berhasil.
        data:
          id: 45
          date: "2025-07-11"
          session: pagi
          photo_url: http://localhost/storage/attendances/1/2025-07-11/photo.jpg
          check_in_at: "2025-07-11T08:15:30.000000Z"
    # ── WFH Reports ─────────────────────────────────────────────────
    StoreReportRequest:
      type: object
      description: |
        WFH report create/update payload. Sent as `multipart/form-data` when
        attendance photos are uploaded (attendances.*.photo are file uploads).
        The `status` field controls validation: when set to `submit`, at least
        one attendance photo OR one activity must be present.
      required: [report_date]
      properties:
        report_date:
          type: string
          format: date
          example: "2025-07-11"
        status:
          type: string
          enum: [draft, submit]
          default: draft
          description: '"draft" saves partial progress; "submit" requires activities or attendance photos.'
          example: submit
        activities:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ReportActivityInput"
        attendances:
          type: object
          nullable: true
          description: |
            Optional attendance photo uploads, keyed by session. Each session
            is independent; provide any subset of pagi/siang/sore. Requires a
            multipart/form-data request body.
          properties:
            pagi:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
            siang:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
            sore:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      example:
        report_date: "2025-07-11"
        status: submit
        activities:
          - start_time: "08:00"
            end_time: "10:00"
            activity: "Menyusun dokumentasi API modul WFH"
            links:
              - https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12
          - start_time: "10:00"
            end_time: "12:00"
            activity: "Review kode fitur change management"
          - start_time: "13:00"
            end_time: "15:30"
            activity: "Perbaikan bug validasi tanggal absensi"
            links:
              - https://git.kominfo.go.id/intern/wfh-api/-/issues/34
    ReportActivityInput:
      type: object
      required: [activity]
      properties:
        start_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: "08:00"
        end_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: "10:00"
        activity:
          type: string
          example: "Menyusun dokumentasi API modul WFH"
        links:
          type: array
          nullable: true
          items:
            type: string
            format: uri
          example:
            - https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12
      example:
        start_time: "08:00"
        end_time: "10:00"
        activity: "Menyusun dokumentasi API modul WFH"
        links:
          - https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12
    WfhReportResource:
      type: object
      required: [id, user_id, report_date, status]
      properties:
        id:
          type: integer
          example: 23
        user_id:
          type: integer
          example: 1
        wfh_attendance_id:
          type: integer
          nullable: true
          example: 45
        report_date:
          type: string
          format: date
          example: "2025-07-11"
        status:
          type: string
          enum: [draft, pending, approved, rejected]
          example: draft
        maker_signed_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-07-11T15:45:00.000000Z"
        supervisor_signed_at:
          type: string
          format: date-time
          nullable: true
          example: null
        reject_reason:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-07-11T14:00:00.000000Z"
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-07-11T14:30:00.000000Z"
        user:
          $ref: "#/components/schemas/ReportUserNested"
        supervisor:
          $ref: "#/components/schemas/ReportUserNested"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/WfhReportActivity"
      example:
        id: 23
        user_id: 1
        wfh_attendance_id: 45
        report_date: "2025-07-11"
        status: pending
        maker_signed_at: "2025-07-11T15:45:00.000000Z"
        supervisor_signed_at: null
        reject_reason: null
        created_at: "2025-07-11T14:00:00.000000Z"
        updated_at: "2025-07-11T15:45:00.000000Z"
        user:
          id: 1
          name: Budi Santoso
          nip: "199001012023011001"
          position: Staf Pelaksana
          rank: Pengatur Muda
          signature_path: signatures/1-signature.png
        supervisor:
          id: 5
          name: Siti Nurhaliza
          nip: "198505202015011001"
          position: Kepala Sub Bagian
          rank: Penata Muda
          signature_path: signatures/5-signature.png
        activities:
          - id: 67
            start_time: "08:00"
            end_time: "10:00"
            activity: "Menyusun dokumentasi API modul WFH"
            sort_order: 1
            links:
              - id: 89
                url: https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12
                sort_order: 1
          - id: 68
            start_time: "10:00"
            end_time: "12:00"
            activity: "Review kode fitur change management"
            sort_order: 2
            links: []
          - id: 69
            start_time: "13:00"
            end_time: "15:30"
            activity: "Perbaikan bug validasi tanggal absensi"
            sort_order: 3
            links:
              - id: 90
                url: https://git.kominfo.go.id/intern/wfh-api/-/issues/34
                sort_order: 1
    ReportUserNested:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Budi Santoso
        nip:
          type: string
          example: "199001012023011001"
        position:
          type: string
          nullable: true
          example: Staf Pelaksana
        rank:
          type: string
          nullable: true
          example: Pengatur Muda
        signature_path:
          type: string
          nullable: true
          example: signatures/1-signature.png
      example:
        id: 1
        name: Budi Santoso
        nip: "199001012023011001"
        position: Staf Pelaksana
        rank: Pengatur Muda
        signature_path: signatures/1-signature.png
    WfhReportActivity:
      type: object
      properties:
        id:
          type: integer
          example: 67
        start_time:
          type: string
          example: "08:00"
        end_time:
          type: string
          example: "10:00"
        activity:
          type: string
          example: "Menyusun dokumentasi API modul WFH"
        sort_order:
          type: integer
          example: 1
        links:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 89
              url:
                type: string
                format: uri
                example: https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12
              sort_order:
                type: integer
                example: 1
      example:
        id: 67
        start_time: "08:00"
        end_time: "10:00"
        activity: "Menyusun dokumentasi API modul WFH"
        sort_order: 1
        links:
          - id: 89
            url: https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12
            sort_order: 1
    WfhReportListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/WfhReportResource"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      example:
        success: true
        data:
          - id: 23
            user_id: 1
            wfh_attendance_id: 45
            report_date: "2025-07-11"
            status: pending
            maker_signed_at: "2025-07-11T15:45:00.000000Z"
            supervisor_signed_at: null
            reject_reason: null
            created_at: "2025-07-11T14:00:00.000000Z"
            updated_at: "2025-07-11T15:45:00.000000Z"
            user:
              id: 1
              name: Budi Santoso
              nip: "199001012023011001"
              position: Staf Pelaksana
              rank: Pengatur Muda
              signature_path: signatures/1-signature.png
            activities:
              - id: 67
                start_time: "08:00"
                end_time: "10:00"
                activity: "Menyusun dokumentasi API modul WFH"
                sort_order: 1
                links: []
        meta:
          current_page: 1
          last_page: 2
          total: 18
    RejectReportRequest:
      type: object
      required: [reason]
      properties:
