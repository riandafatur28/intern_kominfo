  # ── Change Management PDF Export ──────────────────────────────────
  /api/changes/initiations/{id}/pdf:
    get:
      tags: [Change Initiation]
      summary: Export initiation as PDF
      operationId: exportInitiationPdf
      security:
        - bearerAuth: []
      description: |
        Generates a PDF of an approved change initiation (Form Inisiasi Perubahan).
        Contains initiator signature and reviewer (kepala tim) signature.
        Requires `change.initiation.export_pdf` permission.
        Initiation must be in `approved` status.
      parameters:
        - $ref: "#/components/parameters/InitiationIdPath"
      responses:
        "200":
          description: PDF binary
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: Missing permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Initiation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Inisiasi tidak ditemukan.
        "422":
          description: Initiation not yet approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: PDF hanya dapat di-generate untuk inisiasi yang sudah disetujui.
  /api/changes/implementations/{id}/pdf:
    get:
      tags: [Change Implementation]
      summary: Export implementation as PDF
      operationId: exportImplementationPdf
      security:
        - bearerAuth: []
      description: |
        Generates a PDF of a completed change implementation (Form Implementasi Perubahan).
        Contains evaluator, reviewer (kepala tim), and responsible (kepala tim) signatures.
        Requires `change.implementation.export_pdf` permission.
        Implementation must be in `completed` status.
      parameters:
        - $ref: "#/components/parameters/ImplementationIdPath"
      responses:
        "200":
          description: PDF binary
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: Missing permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Implementation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Implementasi tidak ditemukan.
        "422":
          description: Implementation not yet completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: PDF hanya dapat di-generate untuk implementasi yang sudah selesai (diterima).
